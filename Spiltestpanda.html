<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider Runner</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050914;
    font-family: Arial, sans-serif;
    user-select: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#ui {
    position: fixed;
    top: 15px;
    left: 20px;
    color: white;
    font-size: 22px;
    font-weight: bold;
    line-height: 1.35;
    text-shadow: 0 2px 5px black;
    z-index: 5;
}

#speedDisplay {
    position: fixed;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
    z-index: 5;
}

#coinDisplay {
    position: fixed;
    top: 48px;
    right: 20px;
    color: #ffd700;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
    z-index: 5;
}

#doubleJumpDisplay {
    position: fixed;
    top: 81px;
    right: 20px;
    color: #ffd700;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
    z-index: 5;
}

#shopButton {
    position: fixed;
    top: 118px;
    right: 20px;
    padding: 9px 18px;
    border: 0;
    border-radius: 9px;
    background: #1677ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 8;
    box-shadow: 0 3px 12px rgba(0,0,0,.4);
}

#shopButton:hover {
    transform: scale(1.05);
}

#help {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.45);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 15px;
    z-index: 5;
}

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.68);
    color: white;
    z-index: 10;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#gameOver h1 {
    font-size: 60px;
    margin: 0 0 10px;
}

#gameOver p {
    font-size: 21px;
    margin-bottom: 25px;
}

button {
    padding: 13px 25px;
    border: 0;
    border-radius: 10px;
    background: #e11;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}


/* =====================================================
   SHOP
===================================================== */

#shop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 50;
    align-items: center;
    justify-content: center;
}

.shopBox {
    width: min(900px, 94vw);
    max-height: 90vh;
    overflow-y: auto;
    background: #101827;
    border: 2px solid #334155;
    border-radius: 18px;
    color: white;
    padding: 22px;
    box-shadow: 0 15px 60px rgba(0,0,0,.7);
}

.shopHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
}

.shopHeader h2 {
    margin: 0;
    font-size: 30px;
}

.shopMoney {
    color: #ffd700;
    font-size: 20px;
    font-weight: bold;
}

.closeShop {
    background: #ef4444;
    padding: 9px 15px;
    font-size: 15px;
}

.shopSection {
    margin-top: 22px;
}

.shopSection h3 {
    margin: 0 0 10px;
    font-size: 21px;
}

.shopItems {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 10px;
}

.shopItem {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.shopPreview {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 7px;
}

.shopName {
    font-weight: bold;
    font-size: 16px;
}

.shopPrice {
    color: #ffd700;
    font-size: 14px;
    margin: 6px 0;
}

.shopItem button {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    background: #1677ff;
}

.shopItem button.owned {
    background: #22c55e;
}

.shopItem button.equipped {
    background: #64748b;
}

.notEnough {
    background: #7f1d1d !important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    Score: <span id="score">0</span>
    <br>
    Highscore: <span id="highscore">0</span>
</div>

<div id="speedDisplay">
    Speed: <span id="speed">9.0</span>
</div>

<div id="coinDisplay">
    Coins: <span id="coins">0</span>
</div>

<div id="doubleJumpDisplay">
    Double Jump: <span id="doubleJumps">0</span>
</div>

<button id="shopButton" onclick="openShop()">
    SHOP
</button>

<div id="help">
    SPACE / ↑ = hop • Saml coins • Løb over Double Jump-coinen
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Du blev ramt af en panda!</p>
    <button onclick="restartGame()">Prøv igen</button>
</div>


<!-- =====================================================
     SHOP
===================================================== -->

<div id="shop">

    <div class="shopBox">

        <div class="shopHeader">

            <h2>SPIDER SHOP</h2>

            <div>
                <span class="shopMoney">
                    Coins: <span id="shopCoins">0</span>
                </span>

                <button
                    class="closeShop"
                    onclick="closeShop()"
                >
                    Luk
                </button>
            </div>

        </div>


        <div class="shopSection">

            <h3>Spider-dragter</h3>

            <div
                class="shopItems"
                id="suitsShop"
            ></div>

        </div>


        <div class="shopSection">

            <h3>Farver</h3>

            <div
                class="shopItems"
                id="colorsShop"
            ></div>

        </div>


        <div class="shopSection">

            <h3>Trails</h3>

            <div
                class="shopItems"
                id="trailsShop"
            ></div>

        </div>


        <div class="shopSection">

            <h3>Jump-effekter</h3>

            <div
                class="shopItems"
                id="jumpsShop"
            ></div>

        </div>


        <div class="shopSection">

            <h3>Panda-skins</h3>

            <div
                class="shopItems"
                id="pandasShop"
            ></div>

        </div>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let width =
    window.innerWidth;

let height =
    window.innerHeight;

canvas.width =
    width;

canvas.height =
    height;


/* =====================================================
   GAME
===================================================== */

let running = true;

let score = 0;

let scoreTimer = 0;

let highscore =
    Number(
        localStorage.getItem(
            "spiderHighscore"
        )
    ) || 0;


/* =====================================================
   NORMAL COINS
===================================================== */

let coins =
    Number(
        localStorage.getItem(
            "spiderCoins"
        )
    ) || 0;

let normalCoins = [];

const NORMAL_COIN_SIZE = 28;

let normalCoinTimer = 100;


/* =====================================================
   SHOP DATA
===================================================== */

const shopItems = {

    suits: [

        {
            id: "classic",
            name: "Classic",
            price: 0
        },

        {
            id: "shadow",
            name: "Shadow",
            price: 75
        },

        {
            id: "gold",
            name: "Gold",
            price: 150
        },

        {
            id: "ice",
            name: "Ice",
            price: 250
        },

        {
            id: "neon",
            name: "Neon",
            price: 400
        }
    ],


    colors: [

        {
            id: "red",
            name: "Rød",
            price: 0,
            color: "#c91525"
        },

        {
            id: "blue",
            name: "Blå",
            price: 50,
            color: "#1677ff"
        },

        {
            id: "green",
            name: "Grøn",
            price: 75,
            color: "#16a34a"
        },

        {
            id: "purple",
            name: "Lilla",
            price: 100,
            color: "#9333ea"
        },

        {
            id: "cyan",
            name: "Cyan",
            price: 125,
            color: "#06b6d4"
        },

        {
            id: "orange",
            name: "Orange",
            price: 150,
            color: "#f97316"
        }
    ],


    trails: [

        {
            id: "none",
            name: "Ingen",
            price: 0
        },

        {
            id: "web",
            name: "Web Trail",
            price: 100
        },

        {
            id: "fire",
            name: "Fire Trail",
            price: 175
        },

        {
            id: "stars",
            name: "Star Trail",
            price: 250
        },

        {
            id: "speed",
            name: "Speed Trail",
            price: 350
        }
    ],


    jumps: [

        {
            id: "normal",
            name: "Normal",
            price: 0
        },

        {
            id: "blue",
            name: "Blue Burst",
            price: 100
        },

        {
            id: "rings",
            name: "Ringe",
            price: 175
        },

        {
            id: "stars",
            name: "Stjerner",
            price: 250
        },

        {
            id: "shock",
            name: "Shockwave",
            price: 350
        }
    ],


    pandas: [

        {
            id: "classic",
            name: "Classic Panda",
            price: 0
        },

        {
            id: "red",
            name: "Red Panda",
            price: 100
        },

        {
            id: "blue",
            name: "Blue Panda",
            price: 150
        },

        {
            id: "gold",
            name: "Gold Panda",
            price: 300
        },

        {
            id: "robot",
            name: "Robot Panda",
            price: 450
        }
    ]
};


/* =====================================================
   SHOP SAVE DATA
===================================================== */

let owned = JSON.parse(
    localStorage.getItem(
        "spiderOwned"
    ) ||
    '{"suits":["classic"],"colors":["red"],"trails":["none"],"jumps":["normal"],"pandas":["classic"]}'
);


let equipped = JSON.parse(
    localStorage.getItem(
        "spiderEquipped"
    ) ||
    '{"suit":"classic","color":"red","trail":"none","jump":"normal","panda":"classic"}'
);


function saveShopData() {

    localStorage.setItem(
        "spiderCoins",
        coins
    );

    localStorage.setItem(
        "spiderOwned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "spiderEquipped",
        JSON.stringify(equipped)
    );
}


function updateCoinDisplay() {

    document.getElementById(
        "coins"
    ).textContent =
        coins;

    document.getElementById(
        "shopCoins"
    ).textContent =
        coins;
}


/* =====================================================
   DOUBLE JUMP
===================================================== */

let doubleJumps = 0;

let doubleJumpMilestone = 0;

let doubleJumpCoins = [];

let coinSpawnQueue = [];

const COIN_SIZE = 34;


/* =====================================================
   SPEED
===================================================== */

const START_SPEED = 9;

const SPEED_INCREASE = 1.5;

const MAX_SPEED = 24;

let gameSpeed =
    START_SPEED;

let speedLevel = 0;


/* =====================================================
   GROUND
===================================================== */

function groundY() {

    return height - 125;
}


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 150,

    y: 0,

    width: 60,

    height: 105,

    velocityY: 0,

    gravity: 0.82,

    jumpPower: -17,

    grounded: true,

    doubleJumpUsed: false,

    runAnimation: 0,

    jumpAnimation: 0
};


/* =====================================================
   PARTICLES
===================================================== */

let particles = [];


/* =====================================================
   PANDA
===================================================== */

const PANDA_WIDTH = 65;

const PANDA_HEIGHT = 62;

const SPAWN_OFFSET = 300;

const BASE_GROUP_DISTANCE = 145;

const GROUP_PANDA_GAP = 8;

let pandaSpawnTimer = 35;

let pandas = [];

let buildings = [];


/* =====================================================
   BUILDINGS
===================================================== */

function createBuildings() {

    buildings = [];

    let x = 0;

    while (
        x <
        width + 1200
    ) {

        const buildingWidth =
            120 +
            Math.random() * 150;

        const buildingHeight =
            170 +
            Math.random() * 260;

        buildings.push({

            x: x,

            y:
                groundY() -
                buildingHeight,

            width:
                buildingWidth,

            height:
                buildingHeight
        });

        x +=
            buildingWidth +
            25 +
            Math.random() * 40;
    }
}


function updateBuildings() {

    for (
        const building of buildings
    ) {

        building.x -=
            gameSpeed * 0.35;

        if (
            building.x +
            building.width <
            -100
        ) {

            const right =
                Math.max(
                    ...buildings.map(
                        b =>
                            b.x +
                            b.width
                    )
                );

            building.x =
                right +
                30 +
                Math.random() * 60;

            building.width =
                120 +
                Math.random() * 150;

            building.height =
                170 +
                Math.random() * 260;

            building.y =
                groundY() -
                building.height;
        }
    }
}


function drawBuildings() {

    for (
        const building of buildings
    ) {

        ctx.fillStyle =
            "#182235";

        ctx.fillRect(
            building.x,
            building.y,
            building.width,
            building.height
        );

        ctx.fillStyle =
            "#26364e";

        ctx.fillRect(
            building.x + 6,
            building.y + 6,
            building.width - 12,
            8
        );

        for (
            let wx =
                building.x + 15;

            wx <
                building.x +
                building.width -
                12;

            wx += 29
        ) {

            for (
                let wy =
                    building.y + 30;

                wy <
                    groundY() - 20;

                wy += 34
            ) {

                const value =
                    Math.sin(
                        wx * 12.9 +
                        wy * 78.2
                    );

                ctx.fillStyle =
                    value > -0.2
                        ? "#ffd86b"
                        : "#0d1625";

                ctx.fillRect(
                    wx,
                    wy,
                    13,
                    18
                );
            }
        }
    }
}


/* =====================================================
   PANDA VARIATION
===================================================== */

function getPandaVariation() {

    const types = [

        "normal",
        "dark",
        "light",
        "small",
        "big",
        "fastLegs"
    ];

    return types[
        Math.floor(
            Math.random() *
            types.length
        )
    ];
}


/* =====================================================
   PANDA DISTANCE
===================================================== */

function getMinimumPandaDistance() {

    const speedDifference =
        gameSpeed -
        START_SPEED;

    return (

        BASE_GROUP_DISTANCE +

        speedDifference *
        15 +

        Math.random() *
        40
    );
}


/* =====================================================
   RIGHTMOST PANDA
===================================================== */

function getRightmostPanda() {

    if (
        pandas.length === 0
    ) {

        return null;
    }

    let result =
        pandas[0];

    for (
        const panda of pandas
    ) {

        if (
            panda.x +
            panda.width >

            result.x +
            result.width
        ) {

            result =
                panda;
        }
    }

    return result;
}


/* =====================================================
   SPAWN X
===================================================== */

function getSpawnX() {

    let spawnX =
        width +
        SPAWN_OFFSET;

    const rightmost =
        getRightmostPanda();

    if (
        rightmost
    ) {

        spawnX =
            Math.max(

                spawnX,

                rightmost.x +
                rightmost.width +
                getMinimumPandaDistance()
            );
    }

    return spawnX;
}


/* =====================================================
   CREATE PANDA
===================================================== */

function createPanda(x) {

    const variation =
        getPandaVariation();

    let scale = 1;

    if (
        variation ===
        "small"
    ) {

        scale =
            0.82;
    }

    if (
        variation ===
        "big"
    ) {

        scale =
            1.12;
    }

    pandas.push({

        x: x,

        y:
            groundY() -
            PANDA_HEIGHT *
            scale,

        width:
            PANDA_WIDTH *
            scale,

        height:
            PANDA_HEIGHT *
            scale,

        variation:
            variation,

        scale:
            scale,

        animation:
            Math.random() *
            Math.PI *
            2
    });
}


/* =====================================================
   PANDA GROUP
===================================================== */

function createPandaGroup() {

    const x =
        getSpawnX();

    let twoPandasChance =
        0.38;

    if (
        gameSpeed >= 12
    ) {

        twoPandasChance =
            0.34;
    }

    if (
        gameSpeed >= 16
    ) {

        twoPandasChance =
            0.30;
    }

    if (
        gameSpeed >= 20
    ) {

        twoPandasChance =
            0.25;
    }

    if (
        score >= 2000
    ) {

        twoPandasChance -=
            0.05;
    }

    const twoPandas =
        Math.random() <
        twoPandasChance;

    createPanda(x);

    if (
        twoPandas
    ) {

        const firstPanda =
            pandas[
                pandas.length - 1
            ];

        createPanda(

            x +
            firstPanda.width +
            GROUP_PANDA_GAP
        );
    }
}


/* =====================================================
   PANDA SPAWNING
===================================================== */

function updatePandaSpawning() {

    pandaSpawnTimer--;

    if (
        pandaSpawnTimer <= 0
    ) {

        createPandaGroup();

        let baseTime =
            42 -
            gameSpeed *
            0.35;

        let randomTime =
            15 +
            Math.random() *
            25;

        if (
            score >= 2000
        ) {

            baseTime -= 6;

            randomTime -=
                4 +
                Math.random() *
                4;
        }

        pandaSpawnTimer =
            Math.max(
                22,
                baseTime +
                randomTime
            );
    }
}


/* =====================================================
   DOUBLE JUMP MILESTONE
===================================================== */

function checkDoubleJumpMilestone() {

    const newMilestone =
        Math.floor(
            score / 500
        );

    if (
        newMilestone >
        doubleJumpMilestone
    ) {

        const amount =
            newMilestone -
            doubleJumpMilestone;

        for (
            let i = 0;
            i < amount;
            i++
        ) {

            coinSpawnQueue.push(
                true
            );
        }

        doubleJumpMilestone =
            newMilestone;
    }
}


/* =====================================================
   DOUBLE JUMP COIN SPAWN
===================================================== */

function spawnDoubleJumpCoin() {

    if (
        coinSpawnQueue.length === 0
    ) {

        return;
    }

    const coinX =
        width +
        500 +
        Math.random() *
        250;

    const coinY =
        groundY() -
        COIN_SIZE;

    doubleJumpCoins.push({

        x: coinX,

        y: coinY,

        size: COIN_SIZE,

        animation:
            Math.random() *
            Math.PI *
            2
    });

    coinSpawnQueue.shift();
}


/* =====================================================
   DOUBLE JUMP COIN UPDATE
===================================================== */

function updateDoubleJumpCoins() {

    if (

        coinSpawnQueue.length > 0 &&

        doubleJumpCoins.length === 0

    ) {

        spawnDoubleJumpCoin();
    }

    for (
        let i =
            doubleJumpCoins.length - 1;

        i >= 0;

        i--
    ) {

        const coin =
            doubleJumpCoins[i];

        coin.x -=
            gameSpeed;

        coin.animation +=
            0.10;

        if (
            coin.x +
            coin.size <
            -50
        ) {

            doubleJumpCoins.splice(
                i,
                1
            );

            continue;
        }

        if (
            checkCoinCollision(
                player,
                coin
            )
        ) {

            doubleJumps++;

            updateDoubleJumpDisplay();

            doubleJumpCoins.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   COIN COLLISION
===================================================== */

function checkCoinCollision(
    player,
    coin
) {

    return (

        player.x <
        coin.x +
        coin.size

        &&

        player.x +
        player.width >
        coin.x

        &&

        player.y <
        coin.y +
        coin.size

        &&

        player.y +
        player.height >
        coin.y
    );
}


/* =====================================================
   NORMAL COINS
===================================================== */

function spawnNormalCoin() {

    normalCoins.push({

        x:
            width +
            250 +
            Math.random() *
            500,

        y:
            groundY() -
            NORMAL_COIN_SIZE,

        size:
            NORMAL_COIN_SIZE,

        animation:
            Math.random() *
            Math.PI *
            2
    });
}


function updateNormalCoins() {

    normalCoinTimer--;

    if (
        normalCoinTimer <= 0
    ) {

        spawnNormalCoin();

        normalCoinTimer =
            75 +
            Math.random() *
            100;
    }

    for (
        let i =
            normalCoins.length - 1;

        i >= 0;

        i--
    ) {

        const coin =
            normalCoins[i];

        coin.x -=
            gameSpeed;

        coin.animation +=
            0.12;

        if (
            coin.x +
            coin.size <
            -50
        ) {

            normalCoins.splice(
                i,
                1
            );

            continue;
        }

        if (
            checkCoinCollision(
                player,
                coin
            )
        ) {

            coins++;

            updateCoinDisplay();

            saveShopData();

            createCoinParticles(
                coin.x,
                coin.y
            );

            normalCoins.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   DRAW NORMAL COINS
===================================================== */

function drawNormalCoins() {

    for (
        const coin of normalCoins
    ) {

        const pulse =
            Math.sin(
                coin.animation
            ) * 2;

        ctx.save();

        ctx.translate(
            coin.x +
            coin.size / 2,

            coin.y +
            coin.size / 2
        );

        ctx.shadowColor =
            "#ffd700";

        ctx.shadowBlur =
            15;

        ctx.fillStyle =
            "#ffd700";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            coin.size / 2 +
            pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;

        ctx.strokeStyle =

/* =====================================================
   COIN PARTICLES
===================================================== */

function createCoinParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() -
                0.5) * 5,

            vy:
                (Math.random() -
                0.5) * 5,

            life: 30
        });
    }
}


function updateParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            0.12;

        p.life--;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            p.life / 30;

        ctx.fillStyle =
            "#ffd700";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =====================================================

    ) {

/* =====================================================
   PANDA UPDATE
===================================================== */

function updatePandas() {

    updatePandaSpawning();

    for (
        let i =
            pandas.length - 1;

        i >= 0;

        i--
    ) {

        const panda =
            pandas[i];

        panda.x -=
            gameSpeed;

        if (
            panda.variation ===
            "fastLegs"
        ) {

            panda.animation +=
                0.30;

        } else {

            panda.animation +=
                0.17;
        }

        if (
            panda.x +
            panda.width <
            -150
        ) {

            pandas.splice(
                i,
                1
            );

            continue;
        }

        if (
            checkCollision(
                player,
                panda
            )
        ) {

            gameOver();

            return;
        }
    }
}

/* =====================================================
   COLLISION
===================================================== */

function checkCollision(a, b) {

    const playerPaddingX =
        10;

    const playerPaddingY =
        8;

    const pandaPaddingX =
        7;

    const pandaPaddingY =
        5;

    return (

        a.x +
        playerPaddingX <

        b.x +
        b.width -
        pandaPaddingX

        &&

        a.x +
        a.width -
        playerPaddingX >

        b.x +
        pandaPaddingX

        &&

        a.y +
        playerPaddingY <

        b.y +
        b.height -
        pandaPaddingY

        &&

        a.y +
        a.height -
        playerPaddingY >

        b.y +
        pandaPaddingY
    );
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer() {

    player.velocityY +=
        player.gravity;

    player.y +=
        player.velocityY;

    const floor =
        groundY() -
        player.height;

    if (
        player.y >= floor
    ) {

        player.y =
            floor;

        player.velocityY =
            0;

        player.grounded =
            true;

        player.doubleJumpUsed =
            false;

    } else {

        player.grounded =
            false;
    }

    if (
        player.grounded
    ) {

        player.runAnimation +=
            0.35;

    } else {

        player.jumpAnimation +=
            0.18;
    }
}


/* =====================================================
   JUMP
===================================================== */

function jump() {

    if (!running) {

        return;
    }

    if (
        player.grounded
    ) {

        player.velocityY =
            player.jumpPower;

        player.grounded =
            false;

        player.doubleJumpUsed =
            false;

        player.jumpAnimation =
            0;

        createJumpEffect();

        return;
    }

    if (

        !player.grounded &&

        !player.doubleJumpUsed &&

        doubleJumps > 0

    ) {

        player.velocityY =
            player.jumpPower;

        player.doubleJumpUsed =
            true;

        doubleJumps--;

        updateDoubleJumpDisplay();

        player.jumpAnimation =
            0;

        createDoubleJumpEffect();
    }
}


/* =====================================================
   JUMP EFFECTS
===================================================== */

function createJumpEffect() {

    if (
        equipped.jump ===
        "normal"
    ) {

        return;
    }

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        particles.push({

            x:
                player.x +
                player.width / 2,

            y:
                player.y +
                player.height,

            vx:
                (Math.random() -
                .5) * 5,

            vy:
                Math.random() * 2,

            life: 30,

            effect:
                equipped.jump
        });
    }
}


function createDoubleJumpEffect() {

    for (

/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

    ctx.save();

    const centerX =
        player.x +
        player.width / 2;

    const centerY =
        player.y +
        player.height / 2;

    ctx.translate(
        centerX,
        centerY
    );

    const run =
        Math.sin(
            player.runAnimation
        );

    const oppositeRun =
        Math.sin(
            player.runAnimation +
            Math.PI
        );

    const jumping =
        !player.grounded;

    const jumpPower =
        Math.min(
            Math.abs(
                player.velocityY
            ) / 17,
            1
        );


    /* =================================================
       SHOP COLOR
    ================================================= */

    let mainColor =
        "#c91525";

    let secondaryColor =
        "#174ea6";

    const colorItem =
        shopItems.colors.find(
            c =>
                c.id ===
                equipped.color
        );

    if (
        colorItem
    ) {

        mainColor =
            colorItem.color;
    }


    /* SUITS */

    if (
        equipped.suit ===
        "shadow"
    ) {

        mainColor =
            "#111827";

        secondaryColor =
            "#475569";
    }

    if (
        equipped.suit ===
        "gold"
    ) {

        mainColor =
            "#facc15";

        secondaryColor =
            "#92400e";
    }

    if (
        equipped.suit ===
        "ice"
    ) {

        mainColor =
            "#67e8f9";

        secondaryColor =
            "#0284c7";
    }

    if (
        equipped.suit ===
        "neon"
    ) {

        mainColor =
            "#22d3ee";

        secondaryColor =
            "#a855f7";
    }


    /* TRAIL */

    drawPlayerTrail(
        mainColor
    );


    if (
        player.grounded
    ) {

        ctx.translate(
            0,
            Math.abs(run) * 2
        );
    }

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.strokeStyle =
        mainColor;

    ctx.lineWidth =
        13;


    if (jumping) {

        ctx.beginPath();

        ctx.moveTo(
            -10,
            25
        );

        ctx.lineTo(
            -25 -
            jumpPower * 6,
            43
        );

        ctx.lineTo(
            -34,
            55
        );

        ctx.stroke();

        ctx.beginPath();

        );

        );

        );

            25
        );

        ctx.lineTo(
            -16 -
            run * 12,
            45
        );

        ctx.lineTo(
            -25 -
            run * 17,
            63
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            10,
            25
        );

        ctx.lineTo(
            16 -
            run * 12,
            45
        );

        ctx.lineTo(
            25 -
            run * 17,
            63
        );

        ctx.stroke();
    }


    ctx.strokeStyle =

    ctx.lineWidth =

            40
        );

        );

        ctx.moveTo(

            39
        );

        );

/* =====================================================
   PLAYER TRAILS
===================================================== */

function drawPlayerTrail(
    color
) {

    if (
        equipped.trail ===
        "none"
    ) {

        return;
    }

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const x =
            player.x -
            i * 13;

        const y =
            player.y +
            player.height -
            20;

        ctx.globalAlpha =
            0.4 -
            i * .06;

        if (
            equipped.trail ===
            "web"
        ) {

            ctx.strokeStyle =
                "white";

            ctx.lineWidth =
                2;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                8 + i * 2,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }


        if (
            equipped.trail ===
            "fire"
        ) {

            ctx.fillStyle =
                i % 2 === 0
                    ? "#ff3b00"
                    : "#ffd000";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                7 - i,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        if (
            equipped.trail ===
            "stars"
        ) {

            ctx.fillStyle =
                "#ffd700";

            ctx.font =
                "18px Arial";

            ctx.fillText(
                "✦",
                x,
                y
            );
        }


        if (
            equipped.trail ===
            "speed"
        ) {

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                3;

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x - 20,
                y
            );

            ctx.stroke();
        }
    }

    ctx.globalAlpha = 1;
}


/* =====================================================
   SCORE
===================================================== */

function updateScore() {

    scoreTimer++;

    const scoreSpeed =
        Math.max(
            2,
            6 -
            Math.floor(
                gameSpeed / 5
            )
        );

    if (
        scoreTimer >=
        scoreSpeed
    ) {

        score++;

        scoreTimer = 0;

        document.getElementById(
            "score"
        ).textContent =
            score;

        if (
            score >
            highscore
        ) {

            highscore =
                score;

            localStorage.setItem(
                "spiderHighscore",
                highscore
            );

            document.getElementById(
                "highscore"
            ).textContent =
                highscore;
        }

        checkDoubleJumpMilestone();

        const newSpeedLevel =
            Math.floor(
                score / 100
            );

        if (
            newSpeedLevel >
            speedLevel
        ) {

            speedLevel =
                newSpeedLevel;

            gameSpeed =
                Math.min(

                    MAX_SPEED,

                    START_SPEED +
                    speedLevel *
                    SPEED_INCREASE
                );

            document.getElementById(
                "speed"
            ).textContent =
                gameSpeed.toFixed(1);
        }
    }
}


/* =====================================================
   SKY
===================================================== */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "#071124"
    );

    gradient.addColorStop(
        1,
        "#17365d"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle =
        "rgba(255,255,220,.9)";

    ctx.beginPath();

    ctx.arc(
        width - 130,
        100,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const x =
            (i * 137) %
            width;

        const y =
            (i * 71) %
            (height * 0.55);

        ctx.fillRect(
            x,
            y,
            2,
            2
        );
    }
}


/* =====================================================
   GROUND
===================================================== */

function drawGround() {

    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        0,
        groundY(),
        width,
        height -
        groundY()
    );

    ctx.fillStyle =
        "#263244";

    ctx.fillRect(
        0,
        groundY(),
        width,
        7
    );
}


/* =====================================================
   SHOP
===================================================== */

function openShop() {

    running = false;

    document.getElementById(
        "shop"
    ).style.display =
        "flex";

    renderShop();
}


function closeShop() {

    document.getElementById(
        "shop"
    ).style.display =
        "none";

    if (
        document.getElementById(
            "gameOver"
        ).style.display !==
        "flex"
    ) {

        running = true;
    }
}


function renderShop() {

    updateCoinDisplay();

    renderShopCategory(
        "suitsShop",
        "suits",
        "suit"
    );

    renderShopCategory(
        "colorsShop",
        "colors",
        "color"
    );

    renderShopCategory(
        "trailsShop",
        "trails",
        "trail"
    );

    renderShopCategory(
        "jumpsShop",
        "jumps",
        "jump"
    );

    renderShopCategory(
        "pandasShop",
        "pandas",
        "panda"
    );
}


function renderShopCategory(
    elementId,
    category,
    equipName
) {

    const container =
        document.getElementById(
            elementId
        );

    container.innerHTML = "";

    for (
        const item of shopItems[category]
    ) {

        const isOwned =
            owned[category].includes(
                item.id
            );

        const isEquipped =
            equipped[equipName] ===
            item.id;

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "shopItem";


        /* PREVIEW */

        let preview = "";


        if (
            category ===
            "colors"
        ) {

            preview = `
                <div style="
                    width:50px;
                    height:50px;
                    border-radius:50%;
                    background:${item.color};
                    box-shadow:0 0 18px ${item.color};
                "></div>
            `;
        }


        else if (
            category ===
            "suits"
        ) {

            let suitColor =
                "#c91525";

            if (
                item.id ===
                "shadow"
            ) {

                suitColor =
                    "#111827";
            }

            if (
                item.id ===
                "gold"
            ) {

                suitColor =
                    "#facc15";
            }

            if (
                item.id ===
                "ice"
            ) {

                suitColor =
                    "#67e8f9";
            }

            if (
                item.id ===
                "neon"
            ) {

                suitColor =
                    "#22d3ee";
            }

            preview = `
                <div style="
                    width:40px;
                    height:55px;
                    border-radius:14px;
                    background:${suitColor};
                    box-shadow:0 0 12px ${suitColor};
                "></div>
            `;
        }


        else if (
            category ===
            "pandas"
        ) {

            let pandaColor =
                "#eeeeee";

            if (
                item.id ===
                "red"
            ) {

                pandaColor =
                    "#dc2626";
            }

            if (
                item.id ===
                "blue"
            ) {

                pandaColor =
                    "#60a5fa";
            }

            if (
                item.id ===
                "gold"
            ) {

                pandaColor =
                    "#facc15";
            }

            if (
                item.id ===
                "robot"
            ) {

                pandaColor =
                    "#94a3b8";
            }

            preview = `
                <div style="
                    width:50px;
                    height:50px;
                    border-radius:50%;
                    background:${pandaColor};
                    border:5px solid #111;
                "></div>
            `;
        }


        else if (
            category ===
            "trails"
        ) {

            preview = `
                <div style="
                    font-size:38px;
                ">✦</div>
            `;
        }


        else {

            preview = `
                <div style="
                    font-size:38px;
                ">⬆</div>
            `;
        }


        let buttonText =
            "";

        let buttonClass =
            "";


        if (
            isEquipped
        ) {

            buttonText =
                "Udstyret";

            buttonClass =
                "equipped";
        }

        else if (
            isOwned
        ) {

            buttonText =
                "Udstyr";

            buttonClass =
                "owned";
        }

        else {

            buttonText =
                item.price === 0
                    ? "Gratis"
                    : item.price +
                      " coins";
        }


        div.innerHTML = `

            <div class="shopPreview">
                ${preview}
            </div>

            <div class="shopName">
                ${item.name}
            </div>

            <div class="shopPrice">
                ${
                    item.price === 0
                        ? "GRATIS"
                        : item.price +
                          " coins"
                }
            </div>

            <button class="${buttonClass}">
                ${buttonText}
            </button>
        `;


        const button =
            div.querySelector(
                "button"
            );


        if (
            !isOwned &&
            item.price > coins
        ) {

            button.classList.add(
                "notEnough"
            );
        }


        button.addEventListener(
            "click",
            () => {

                /* UDSTYR */

                if (
                    isOwned
                ) {

                    equipped[
                        equipName
                    ] =
                        item.id;

                    saveShopData();

                    renderShop();

                    return;
                }


                /* KØB */

                if (
                    coins <
                    item.price
                ) {

                    button.textContent =
                        "Ikke nok coins";

                    return;
                }


                coins -=
                    item.price;


                owned[
                    category
                ].push(
                    item.id
                );


                equipped[
                    equipName
                ] =
                    item.id;


                saveShopData();

                updateCoinDisplay();

                renderShop();
            }
        );


        container.appendChild(
            div
        );
    }
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    if (!running) {

        return;
    }

    running =
        false;

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";
}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    score = 0;

    scoreTimer = 0;

    speedLevel = 0;

    gameSpeed =
        START_SPEED;

    doubleJumps = 0;

    doubleJumpMilestone = 0;

    doubleJumpCoins = [];

    coinSpawnQueue = [];

    normalCoins = [];

    normalCoinTimer = 100;

    pandaSpawnTimer = 35;

    pandas = [];

    particles = [];

    player.x = 150;

    player.y =
        groundY() -
        player.height;

    player.velocityY = 0;

    player.grounded =
        true;

    player.doubleJumpUsed =
        false;

    player.runAnimation = 0;

    player.jumpAnimation = 0;


    document.getElementById(
        "score"
    ).textContent =
        "0";


    document.getElementById(
        "speed"
    ).textContent =
        gameSpeed.toFixed(1);


    updateDoubleJumpDisplay();

    updateCoinDisplay();

    createBuildings();

    running =
        true;

    document.getElementById(
        "gameOver"
    ).style.display =
        "none";
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code ===
            "Space" ||

            event.code ===
            "ArrowUp"
        ) {

            event.preventDefault();

            jump();
        }
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        width =
            window.innerWidth;

        height =
            window.innerHeight;

        canvas.width =
            width;

        canvas.height =
            height;

        createBuildings();

        const floor =
            groundY() -
            player.height;

        if (
            player.y >
            floor
        ) {

            player.y =
                floor;
        }
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    drawSky();

    if (running) {

        updateBuildings();

        updatePlayer();

        updatePandas();

        updateDoubleJumpCoins();

        updateNormalCoins();

        updateParticles();

        updateScore();
    }

    drawBuildings();

    drawGround();

    drawNormalCoins();

    drawDoubleJumpCoins();

    for (
        const panda of pandas
    ) {

        drawPanda(
            panda
        );
    }

    drawParticles();

    drawPlayer();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   START
===================================================== */

createBuildings();

player.y =
    groundY() -
    player.height;

player.grounded =
    true;

document.getElementById(
    "highscore"
).textContent =
    highscore;

document.getElementById(
    "speed"
).textContent =
    gameSpeed.toFixed(1);

updateDoubleJumpDisplay();

updateCoinDisplay();

gameLoop();

</script>
